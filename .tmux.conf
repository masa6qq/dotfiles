# Set C-i to prefix key
set -g prefix C-q

# Unset default prefix key
unbind C-b

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",$TERM:Tc"

# Set copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe
bind -T copy-mode-vi Enter send-keys -X copy-pipe

set-hook -g pane-mode-changed 'if -F "#{m/r:(copy|view)-mode,#{pane_mode}}" "set status-style bg=cyan,fg=black" "set -u status-style"'

# Extend the limit of history
set-option -g history-limit 10000

# Set clear history key bind
bind k clear-history

# Like vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Auto pane rezie
bind '"' split-window -v \; select-layout -E
bind % split-window -h \; select-layout -E
set-hook -g pane-exited 'select-layout -E'

# Status bar background color (day default; swapped to night by the hook below)
set -g status-style bg="#cb9057",fg=black

# Don't truncate the session name
set -g status-left-length 40

# Swap status bar colors between 16:00-07:00 (night) and 07:00-16:00 (day),
# and keep the active-window highlight as the inverse of the bar.
# Runs as a side effect every status-bar refresh (prints nothing itself).
set -g status-left "#(~/.tmux-daynight.sh)[#S] "

# Give the active-window highlight a bit of breathing room
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "

# Highlight color for session/window chooser (prefix + s, prefix + w)
set -g mode-style bg="#cb9057",fg=black

# Hide hostname/time, show USD/JPY, EUR/JPY, CHF/JPY (with sparkline)
set -g status-right-length 90
set -g status-right "#(~/.tmux-fx.sh) "
